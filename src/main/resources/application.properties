spring.application.name=pomodoro-backend
spring.config.import=optional:secrets.properties
#spring.datasource.url=${db.url}
#spring.datasource.username=${db.username}
#spring.datasource.password=${db.password}

spring.datasource.url=${localdb.url}
spring.datasource.username=${localdb.username}
spring.datasource.password=${localdb.password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.db.fresh=false
spring.flyway.clean-disabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}

logging.level.org.springframework.security.web.access.ExceptionTranslationFilter=DEBUG